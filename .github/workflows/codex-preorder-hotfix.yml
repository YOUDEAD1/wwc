name: Codex preorder hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-preorder-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preorder hotfix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, content) {
            fs.writeFileSync(file, content);
          }

          function replaceOnce(file, before, after, label) {
            let s = read(file);
            if (s.includes(after)) {
              console.log(`${file}: already ${label}`);
              return;
            }
            if (!s.includes(before)) {
              throw new Error(`${file}: missing target for ${label}`);
            }
            s = s.replace(before, after);
            write(file, s);
            console.log(`${file}: applied ${label}`);
          }

          function insertBefore(file, anchor, insertion, marker, label) {
            let s = read(file);
            if (s.includes(marker)) {
              console.log(`${file}: already ${label}`);
              return;
            }
            if (!s.includes(anchor)) {
              throw new Error(`${file}: missing anchor for ${label}`);
            }
            s = s.replace(anchor, `${insertion}${anchor}`);
            write(file, s);
            console.log(`${file}: inserted ${label}`);
          }

          replaceOnce(
            'config/index.ts',
            "  pre_order: 'blue',",
            "  pre_order: 'red',",
            'red preorder button color',
          );

          insertBefore(
            'config/locales/en.ts',
            "  'shop.product.line.referral.progress':\n",
            "  'shop.product.line.preorder_notice':\n    '{feed_title} *Order Will automatically sended with in second after restock*',\n",
            "'shop.product.line.preorder_notice'",
            'out-of-stock preorder notice',
          );

          insertBefore(
            'config/locales/en.ts',
            "  // Email follow-up #1: shown after Order Delivered when the buyer\n",
            "  'shop.buy.order_auto_delivered': [\n    '{order_delivered} *Delivery has been automatically done!*',\n    '',\n    '*Order ID#:* `{order_id}`',\n    '*Product:* {name}',\n    '*Quantity:* {qty}',\n    '*Total Paid:* {total} USDT',\n    '',\n    '{delivered_items} *Items:*',\n    '{items}',\n  ].join('\\n'),\n",
            "'shop.buy.order_auto_delivered'",
            'auto-delivered preorder card text',
          );

          replaceOnce(
            'config/locales/en.ts',
            "    'Preorder pending — admin will deliver after restock.',",
            "    'Preorder pending — automatically deliver will be done after restock.',",
            'preorder pending status text',
          );

          insertBefore(
            'src/handlers/shop.ts',
            "  // Teaser line under Warranty.\n",
            "  if (!p.unlimited_stock && p.stock <= 0) {\n    lines.push(ctx.t('shop.product.line.preorder_notice'));\n  }\n",
            "shop.product.line.preorder_notice",
            'product preorder notice line',
          );

          replaceOnce(
            'src/handlers/shop.ts',
            "    balanceAfter: Number(balanceAfter.toFixed(3)),\n  });",
            "    balanceAfter: Number(balanceAfter.toFixed(3)),\n    lifecycle: preorder ? 'preorder' : 'delivered',\n  });",
            'wallet/referral preorder admin lifecycle',
          );

          replaceOnce(
            'src/services/adminLog.ts',
            "  balanceAfter: number;\n}): Promise<void> {\n  const body = compose({\n    tag: 'ORDER',\n    title: 'Order Delivered',",
            "  balanceAfter: number;\n  lifecycle?: 'delivered' | 'preorder' | 'auto_delivered';\n}): Promise<void> {\n  const preorder = args.lifecycle === 'preorder';\n  const autoDelivered = args.lifecycle === 'auto_delivered';\n  const body = compose({\n    tag: preorder || autoDelivered ? 'PREORDER' : 'ORDER',\n    title: preorder\n      ? 'Preorder Placed - Delivery Remain'\n      : autoDelivered\n        ? 'Preorder Auto Delivered'\n        : 'Order Delivered',",
            'order log lifecycle title',
          );

          replaceOnce(
            'src/services/adminLog.ts',
            "      `Paid Via: ${escapeHtml(args.paidVia)}`,\n      '',\n      '👛 <b>Wallet</b>',",
            "      `Paid Via: ${escapeHtml(args.paidVia)}`,\n      preorder ? 'Status: Preorder delivery remain until restock.' : '',\n      autoDelivered ? 'Status: Automatic delivery completed after restock.' : '',\n      '',\n      '👛 <b>Wallet</b>',",
            'order log status row',
          );

          replaceOnce(
            'src/services/adminLog.ts',
            "  void publicFeed.notifyPurchase(api, {\n    buyerId: args.user.telegram_id,\n    productId: args.productId,\n    productName: args.productName,\n    orderPublicId: args.orderPublicId,\n    qty: args.qty,\n    total: args.total,\n    paidVia: args.paidVia,\n  });\n  await send(api, body, 'orders');",
            "  if (!autoDelivered) {\n    void publicFeed.notifyPurchase(api, {\n      buyerId: args.user.telegram_id,\n      productId: args.productId,\n      productName: args.productName,\n      orderPublicId: args.orderPublicId,\n      qty: args.qty,\n      total: args.total,\n      paidVia: args.paidVia,\n    });\n  }\n  await send(api, body, 'orders');",
            'avoid duplicate public purchase feed on auto-delivery',
          );

          replaceOnce(
            'src/services/orderFulfill.ts',
            "      balanceAfter: Number((user?.balance ?? 0).toFixed(3)),\n    })",
            "      balanceAfter: Number((user?.balance ?? 0).toFixed(3)),\n      lifecycle: preorder ? 'preorder' : 'delivered',\n    })",
            'direct-pay preorder admin lifecycle',
          );

          insertBefore(
            'src/services/preorder.ts',
            "import { sendInvoiceEmail } from './mailer.js';\n",
            "import * as adminLog from './adminLog.js';\n",
            "import * as adminLog",
            'admin log import',
          );

          replaceOnce(
            'src/services/preorder.ts',
            "          t('shop.buy.order_delivered', {",
            "          t('shop.buy.order_auto_delivered', {",
            'buyer auto-delivered preorder message',
          );

          insertBefore(
            'src/services/preorder.ts',
            "      if (user?.email) {\n",
            "      void adminLog\n        .logOrderCreated(api, {\n          user: {\n            telegram_id: order.user_id,\n            username: user?.username ?? null,\n            first_name: user?.first_name ?? null,\n            email: user?.email ?? null,\n          },\n          orderDbId: order.id,\n          orderPublicId: publicId,\n          productId,\n          productName: order.product_name,\n          qty: order.qty,\n          unitPrice: Number(order.unit_price),\n          total: Number(order.total),\n          paidVia: paidViaForPreorder(Number(order.total)),\n          balanceAfter: Number((user?.balance ?? 0).toFixed(3)),\n          lifecycle: 'auto_delivered',\n        })\n        .catch((err) => logger.warn({ err }, 'preorder: auto-delivery admin log failed'));\n\n",
            "lifecycle: 'auto_delivered'",
            'restock auto-delivery admin log',
          );

          fs.unlinkSync('.github/workflows/codex-preorder-hotfix.yml');

          cp.execFileSync('git', ['config', 'user.name', 'github-actions[bot]'], { stdio: 'inherit' });
          cp.execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], { stdio: 'inherit' });
          cp.execFileSync('git', ['add', '-A'], { stdio: 'inherit' });
          const status = cp.execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' });
          if (!status.trim()) {
            console.log('No changes to commit.');
            process.exit(0);
          }
          cp.execFileSync('git', ['commit', '-m', 'Fix preorder auto delivery messaging'], { stdio: 'inherit' });
          cp.execFileSync('git', ['push'], { stdio: 'inherit' });
          NODE
